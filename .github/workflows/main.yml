name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet
        run: |
          pip install "flet[all]==0.86.5"

      - name: Build APK
        run: |
          echo y | flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            build/**/*.apk
